esphome:
  name: electrolyseur-racer
  friendly_name: Electrolyseur Racer

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

api:
  encryption:
    key: "CDKxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxcg="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
 
uart:
  id: modbus_uart
  tx_pin: GPIO6
  rx_pin: GPIO7
  baud_rate: 9600
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

modbus:
  id: modbus_pool

modbus_controller:
  - id: ibiza
    address: 10
    modbus_id: modbus_pool
    update_interval: 3s

globals:
  - id: consigne_avant_boost
    type: float
    restore_value: false
    initial_value: "0"

sensor:
  - platform: modbus_controller
    id: temp_eau
    modbus_controller_id: ibiza
    name: "Température Eau"
    register_type: holding
    address: 260
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    id: taux_sel
    modbus_controller_id: ibiza
    name: "Taux de sel"
    register_type: holding
    address: 261
    value_type: U_WORD
    unit_of_measurement: "g/L"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    id: consigne_electrolyse_retour
    modbus_controller_id: ibiza
    name: "Valeur Consigne Électrolyse"
    register_type: holding
    address: 4168
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: modbus_controller
    id: tension_cellule
    modbus_controller_id: ibiza
    name: "Tension cellule"
    register_type: holding
    address: 1061
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    id: courant_cellule
    modbus_controller_id: ibiza
    name: "Courant cellule"
    register_type: holding
    address: 1062
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 1
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    id: puissance_cellule_modbus
    modbus_controller_id: ibiza
    name: "Puissance cellule"
    register_type: holding
    address: 1063
    value_type: U_WORD
    unit_of_measurement: "W"
    accuracy_decimals: 0

  - platform: modbus_controller
    id: heures_fonctionnement
    modbus_controller_id: ibiza
    name: "Heures de Fonctionnement"
    register_type: holding
    address: 4463
    value_type: U_WORD
    unit_of_measurement: "h"
    accuracy_decimals: 0

  - platform: template
    id: heure_inversion_cellule
    name: "Heure inversion cellule"
    unit_of_measurement: "h"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (isnan(id(inversion_cellule_modbus).state)) {
        return NAN;
      }
      return id(inversion_cellule_modbus).state;

  - platform: template
    id: puissance_reelle_cellule
    name: "Puissance réelle cellule"
    unit_of_measurement: "W"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(tension_cellule).state) ||
          isnan(id(courant_cellule).state)) {
        return NAN;
      }

      return id(tension_cellule).state *
             id(courant_cellule).state;

  - platform: modbus_controller
    id: volume_bassin_lecture
    modbus_controller_id: ibiza
    name: "Volume bassin"
    register_type: holding
    address: 4111
    value_type: U_WORD
    unit_of_measurement: "m³"
    icon: mdi:pool
    accuracy_decimals: 0

  - platform: modbus_controller
    id: boost_temps_restant
    modbus_controller_id: ibiza
    name: "Boost Temps Restant"
    register_type: holding
    address: 4188
    value_type: U_WORD
    unit_of_measurement: "min"
    icon: mdi:timer-sand
    accuracy_decimals: 0

    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return x > 0;
            then:
              - switch.template.publish:
                  id: mode_boost
                  state: ON
            else:
              - switch.template.publish:
                  id: mode_boost
                  state: OFF

number:
  - platform: modbus_controller
    id: consigne_electrolyse
    modbus_controller_id: ibiza
    name: "Consigne Électrolyse"
    register_type: holding
    address: 4168
    value_type: U_WORD
    min_value: 0
    max_value: 80
    step: 5
    unit_of_measurement: "%"
    mode: slider
    write_lambda: |-
      return static_cast<uint16_t>(x);

  - platform: modbus_controller
    id: inversion_cellule_modbus
    modbus_controller_id: ibiza
    name: "Réglage Heure inversion cellule"
    register_type: holding
    address: 4170
    value_type: U_WORD
    min_value: 1
    max_value: 24
    step: 1
    unit_of_measurement: "h"
    mode: box
    write_lambda: |-
      return static_cast<uint16_t>(x);

  - platform: modbus_controller
    id: volume_bassin_reglage
    modbus_controller_id: ibiza
    name: "Réglage Volume bassin"
    register_type: holding
    address: 4111
    value_type: U_WORD
    min_value: 1
    max_value: 250
    step: 1
    unit_of_measurement: "m³"
    mode: box
    write_lambda: |-
      return static_cast<uint16_t>(x);

  - platform: modbus_controller
    id: boost_duree_commande
    modbus_controller_id: ibiza
    internal: true
    register_type: holding
    address: 4188
    value_type: U_WORD
    min_value: 0
    max_value: 1440
    step: 1
    write_lambda: |-
      return static_cast<uint16_t>(x);

binary_sensor:

  - platform: modbus_controller
    modbus_controller_id: ibiza
    name: "Alarme - Défaut cellule"
    register_type: holding
    address: 4172
    bitmask: 0x0002
    device_class: problem

  - platform: modbus_controller
    modbus_controller_id: ibiza
    name: "Alarme - Manque de sel"
    register_type: holding
    address: 4172
    bitmask: 0x0004
    device_class: problem

  - platform: modbus_controller
    modbus_controller_id: ibiza
    name: "Alarme - Trop de sel"
    register_type: holding
    address: 4172
    bitmask: 0x0008
    device_class: problem

  - platform: modbus_controller
    modbus_controller_id: ibiza
    name: "Alarme - Eau Froide"
    register_type: holding
    address: 4172
    bitmask: 0x0010
    device_class: problem

  - platform: template
    id: sens_polarite_cellule
    name: "Cellule Polarité Inverse"
    icon: mdi:cached
    lambda: |-
      if (isnan(id(registre_erreur_brut).state)) {
        return {};
      }

      const uint16_t value =
          static_cast<uint16_t>(
            id(registre_erreur_brut).state
          );

      return (value & 0x0100) == 0;

  - platform: status
    name: "Statut ESP"
  - platform: template
    id: liaison_modbus_controller
    name: "Liaison Modbus Controller"

    lambda: |-
      return !id(ibiza).get_module_offline();

switch:
  - platform: modbus_controller
    id: marche_automatique
    modbus_controller_id: ibiza
    name: "Marche automatique"
    register_type: holding
    address: 4171
    bitmask: 0x0001

  - platform: modbus_controller
    id: boost_activation_interne
    modbus_controller_id: ibiza
    internal: true
    register_type: holding
    address: 4182
    bitmask: 0x0100

  - platform: template
    id: mode_boost
    name: "Mode Boost"
    icon: mdi:rocket-launch
    optimistic: true
    restore_mode: ALWAYS_OFF

    turn_on_action:
      - lambda: |-
          if (!isnan(id(consigne_electrolyse_retour).state)) {
            id(consigne_avant_boost) =
                id(consigne_electrolyse_retour).state;
          } else {
            id(consigne_avant_boost) = 0;
          }

      - lambda: |-
          auto command =
            esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
              id(ibiza),
              4168,
              100
            );
          id(ibiza)->queue_command(command);

      - number.set:
          id: boost_duree_commande
          value: 60

      - delay: 1s

      - switch.turn_on: boost_activation_interne

    turn_off_action:
      - switch.turn_off: boost_activation_interne

      - delay: 500ms

      - number.set:
          id: boost_duree_commande
          value: 0

      - number.set:
          id: consigne_electrolyse
          value: !lambda |-
            return id(consigne_avant_boost);

button:
  - platform: restart
    name: "Reboot ESP"

text_sensor:
  - platform: template
    id: mode_traduit
    name: "Mode Électrolyseur"
    icon: mdi:play-circle
    update_interval: 5s
    lambda: |-
      if (isnan(id(mode_fonctionnement_brut).state)) {
        return {"Inconnu"};
      }

      if (id(boost_temps_restant).has_state() &&
          id(boost_temps_restant).state > 0) {
        return {"Mode Boost"};
      }

      const uint16_t mode =
          static_cast<uint16_t>(
            id(mode_fonctionnement_brut).state
          );

      if (mode == 0) {
        return {"Arrêt / Veille"};
      }

      return {"Production active"};

  - platform: template
    id: statut_alarme_traduit
    name: "Statut Alarme Électrolyseur"
    icon: mdi:alert-circle
    update_interval: 5s
    lambda: |-
      if (isnan(id(registre_erreur_brut).state)) {
        return {"Déconnecté (Modbus)"};
      }

      const uint16_t alarme =
          static_cast<uint16_t>(
            id(registre_erreur_brut).state
          );

      std::string message;

      if (alarme & 0x0002) {
        message += "ALARME A1 (Défaut cellule), ";
      }

      if (alarme & 0x0004) {
        message += "ALARME A2 (Sel bas), ";
      }

      if (alarme & 0x0008) {
        message += "Erreur sel haut, ";
      }

      if (alarme & 0x0010) {
        message += "Sécurité eau froide, ";
      }

      if (message.empty()) {
        return {"Aucune alarme"};
      }

      message.resize(message.size() - 2);
      return message;
